<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width,initial-scale=1,viewport-fit=cover"
  >

  <meta
    name="theme-color"
    content="#080a0e"
  >

  <title>LOGIC-LEAF</title>

  <link
    rel="stylesheet"
    href="style.css"
  >

  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>

  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
</head>

<body>

<div id="app">

  <aside
    id="sidebar"
    class="sidebar"
  >

    <div class="brand">

      <div class="brandMark">
        LL
      </div>

      <div class="brandText">
        <b>LOGIC-LEAF</b>
        <small>AI Assistant</small>
      </div>

      <button
        id="closeSide"
        class="iconBtn closeSide"
        aria-label="Close sidebar"
      >
        ×
      </button>

    </div>

    <button
      id="newChat"
      class="newChat"
    >
      <span class="plus">＋</span>
      <span>New chat</span>
    </button>

    <div class="sideTitle">
      RECENT CHATS
    </div>

    <div
      id="history"
      class="history"
    ></div>

    <div class="sideBottom">

      <button
        id="settingsBtn"
        class="sideBtn"
      >
        <span>⚙</span>
        <span>Settings</span>
      </button>

      <div class="developer">

        <b>LOGIC-LEAF</b>

        <span>
          V.CHENCHUKIRAN
        </span>

        <span>
          CLOUD SECURITY
        </span>

      </div>

    </div>

  </aside>

  <main class="main">

    <header class="topbar">

      <button
        id="menuBtn"
        class="iconBtn menu"
        aria-label="Open sidebar"
      >
        ☰
      </button>

      <div class="topTitle">
        LOGIC-LEAF
      </div>

      <div class="topActions">

        <button
          id="searchBtn"
          class="toolBtn"
        >
          <span class="toolIcon">⌕</span>
          <span>Search</span>
        </button>

        <button
          id="accountBtn"
          class="avatar"
          aria-label="Account"
        >
          ◯
        </button>

      </div>

    </header>

    <section
      id="chat"
      class="chat"
    >

      <div
        id="welcome"
        class="welcome"
      >

        <div class="heroLogo">
          LL
        </div>

        <h1>
          How can I help you today?
        </h1>

        <p>
          Ask questions, study, code,
          analyze files, understand images,
          search the web, or create images.
        </p>

        <div class="suggestions">

          <button
            data-prompt="Explain quantum computing simply."
          >
            <strong>
              Explain something
            </strong>

            <small>
              Get a clear explanation
            </small>
          </button>

          <button
            data-prompt="Teach me a topic step by step and quiz me at the end."
          >
            <strong>
              Study with me
            </strong>

            <small>
              Learn interactively
            </small>
          </button>

          <button
            data-image="true"
            data-prompt="Create a cinematic photorealistic image of a futuristic Indian city at sunset, advanced skyscrapers, autonomous vehicles, sustainable green technology, dramatic sky, highly detailed."
          >
            <strong>
              Create an image
            </strong>

            <small>
              Generate with AI
            </small>
          </button>

          <button
            id="fileCard"
          >
            <strong>
              Analyze a file
            </strong>

            <small>
              Upload a document
            </small>
          </button>

        </div>

      </div>

    </section>

    <div
      id="typing"
      class="typing hidden"
    >
      <span></span>
      <span></span>
      <span></span>
      Thinking…
    </div>

    <div class="composerWrap">

      <div
        id="preview"
        class="preview hidden"
      ></div>

      <div class="composer">

        <button
          id="attachBtn"
          class="composerBtn"
          title="Attach file"
        >
          📎
        </button>

        <button
          id="cameraBtn"
          class="composerBtn"
          title="Camera"
        >
          ◉
        </button>

        <button
          id="imageBtn"
          class="composerBtn"
          title="Create image"
        >
          ▧
        </button>

        <button
          id="pdfBtn"
          class="composerBtn"
          title="Create PDF"
        >
          ▤
        </button>

        <button
          id="searchComposer"
          class="composerBtn"
          title="Web search"
        >
          ⌕
        </button>

        <textarea
          id="input"
          rows="1"
          placeholder="Message LOGIC-LEAF…"
          autocomplete="off"
        ></textarea>

        <button
          id="sendBtn"
          class="send"
          aria-label="Send"
        >
          ➤
        </button>

      </div>

      <div class="disclaimer">
        LOGIC-LEAF can make mistakes.
        Check important information.
      </div>

    </div>

  </main>

</div>

<input
  id="fileInput"
  type="file"
  hidden
  accept="image/*,.txt,.md,.csv,.json,.js,.html,.css,.py,.java,.c,.cpp,.pdf"
>

<input
  id="cameraInput"
  type="file"
  hidden
  accept="image/*"
  capture="environment"
>

<div
  id="overlay"
  class="overlay hidden"
>

  <div class="modal">

    <button
      id="modalClose"
      class="modalClose"
      aria-label="Close"
    >
      ×
    </button>

    <h2 id="modalTitle">
      Settings
    </h2>

    <div id="modalBody"></div>

  </div>

</div>

<script src="app.js"></script>

</body>
        </html>
