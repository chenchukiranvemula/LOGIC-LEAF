<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#030605">

    <title>QTM AI</title>

    <link rel="stylesheet" href="style.css">

    <script type="module" src="app.js"></script>
</head>

<body>

    <div class="ambient ambient-one"></div>
    <div class="ambient ambient-two"></div>
    <div class="leaf-bg"></div>

    <!-- LOGIN -->

    <section id="loginScreen" class="login-screen">

        <div class="login-card">

            <div class="q-logo">Q</div>

            <h1>QTM AI</h1>

            <p class="tagline">
                Intelligence. Simplified.
            </p>

            <div class="line"></div>

            <button id="googleLogin" class="google-btn">

                <span class="google-icon">
                    G
                </span>

                <span>
                    Continue with Google
                </span>

            </button>

            <p id="loginError" class="login-error"></p>

            <p class="small-note">
                Secure authentication powered by Firebase
            </p>

        </div>

    </section>


    <!-- APP -->

    <div id="app" class="app hidden">

        <!-- SIDEBAR -->

        <aside class="sidebar">

            <div class="brand">

                <div class="brand-logo">
                    Q
                </div>

                <div>
                    <div class="brand-title">
                        QTM AI
                    </div>

                    <div class="brand-subtitle">
                        AI Workspace
                    </div>
                </div>

            </div>


            <button id="newChat" class="new-chat">
                <span>＋</span>
                New chat
            </button>


            <div class="label">
                CONVERSATIONS
            </div>


            <div id="chatList" class="chat-list"></div>


            <div class="profile">

                <img id="avatar" class="avatar" alt="Profile">

                <div class="profile-info">

                    <strong id="username">
                        User
                    </strong>

                    <span id="email">
                        Signed in
                    </span>

                </div>

                <button id="logout" class="logout">
                    ⎋
                </button>

            </div>

        </aside>


        <!-- MAIN -->

        <main class="main">

            <header class="topbar">

                <div class="mobile-brand">
                    <div class="mobile-logo">Q</div>
                    <span>QTM AI</span>
                </div>

                <div class="online">
                    <i></i>
                    Online
                </div>

            </header>


            <section id="messages" class="messages"></section>


            <div class="composer-wrap">

                <div class="composer">

                    <textarea
                        id="input"
                        placeholder="Ask QTM AI anything..."
                        rows="1"
                        maxlength="12000"
                    ></textarea>

                    <button id="send" class="send">
                        ↑
                    </button>

                </div>

                <div class="hint">
                    QTM AI can make mistakes. Verify important information.
                </div>

            </div>

        </main>

    </div>

</body>
</html>
