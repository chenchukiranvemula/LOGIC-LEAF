<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>QTM AI</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <div class="background">
    <div class="leaf">🌿</div>
    <div class="glow glow1"></div>
    <div class="glow glow2"></div>
  </div>

  <div class="app">

    <!-- SIDEBAR -->
    <aside class="sidebar">

      <div class="logo">
        <div class="logo-icon">🌿</div>

        <div>
          <strong>QTM AI</strong>
          <small>AI Assistant</small>
        </div>
      </div>

      <button id="newChatBtn" class="new-chat">
        ＋ New Chat
      </button>

      <div class="history-title">
        CHATS
      </div>

      <div id="chatHistory" class="history">
        <span>No chats yet</span>
      </div>

      <div class="sidebar-bottom">
        <button>⚙️ Settings</button>
        <button>👤 Google Login</button>
      </div>

    </aside>


    <!-- MAIN -->
    <main class="main">

      <!-- HEADER -->
      <header class="header">

        <button id="menuBtn" class="menu">
          ☰
        </button>

        <div>
          <strong>QTM AI</strong>
          <small>Intelligent Assistant</small>
        </div>

        <div class="status">
          <span></span>
          Online
        </div>

      </header>


      <!-- CHAT -->
      <section
        id="chatMessages"
        class="chat"
      >

        <div id="welcome" class="welcome">

          <div class="welcome-icon">
            🌿
          </div>

          <h1>
            What can I help you with?
          </h1>

          <p>
            Ask QTM AI anything.
          </p>

          <div class="cards">

            <button onclick="useSuggestion('Explain quantum physics simply')">
              🧠
              <span>Explain something</span>
            </button>

            <button onclick="useSuggestion('Help me solve a mathematics problem')">
              🧮
              <span>Solve a problem</span>
            </button>

            <button onclick="useSuggestion('Write a Python program for me')">
              💻
              <span>Write code</span>
            </button>

            <button onclick="useSuggestion('Give me a JEE study plan')">
              📚
              <span>Study with me</span>
            </button>

          </div>

        </div>

      </section>


      <!-- ================================= -->
      <!-- TYPING / ASK BAR -->
      <!-- ================================= -->

      <div class="ask-container">

        <div class="ask-bar">

          <button
            class="attach"
            title="Attach"
          >
            ＋
          </button>

          <textarea
            id="chatInput"
            placeholder="Ask QTM AI anything..."
            rows="1"
          ></textarea>

          <button
            id="sendBtn"
            class="send"
          >
            ↑
          </button>

        </div>

        <div class="ask-info">
          QTM AI can make mistakes. Check important information.
        </div>

      </div>

    </main>

  </div>


  <script src="app.js"></script>


  <script>

    function useSuggestion(text) {

      const input =
        document.getElementById("chatInput");

      input.value = text;

      input.focus();

    }


    const menuBtn =
      document.getElementById("menuBtn");

    const sidebar =
      document.querySelector(".sidebar");


    menuBtn.addEventListener(
      "click",
      () => {

        sidebar.classList.toggle("open");

      }
    );

  </script>

</body>
  </html>
