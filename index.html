 <!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0"
    >

    <meta
        name="theme-color"
        content="#212121"
    >

    <meta
        name="description"
        content="LOGIC-LEAF AI — intelligent AI assistant"
    >

    <title>LOGIC-LEAF AI</title>

    <!-- Google Font -->
    <link
        rel="preconnect"
        href="https://fonts.googleapis.com"
    >

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
        rel="stylesheet"
    >

    <!-- Main CSS -->
    <link
        rel="stylesheet"
        href="style.css"
    >
</head>


<body>

<!-- =====================================================
     BACKGROUND
     ===================================================== -->

<div class="background-effects">

    <div class="gradient-orb orb-one"></div>

    <div class="gradient-orb orb-two"></div>

    <div class="gradient-orb orb-three"></div>

    <div class="leaf-background">
        <span></span>
        <span></span>
        <span></span>
        <span></span>
        <span></span>
    </div>

</div>


<!-- =====================================================
     MOBILE OVERLAY
     ===================================================== -->

<div
    class="overlay"
    id="overlay"
></div>


<!-- =====================================================
     APPLICATION
     ===================================================== -->

<div class="app">


    <!-- =================================================
         SIDEBAR
         ================================================= -->

    <aside
        class="sidebar"
        id="sidebar"
    >

        <!-- SIDEBAR HEADER -->

        <div class="sidebar-header">

            <div class="brand">

                <div class="brand-mark">
                    L
                </div>

                <div class="brand-name">
                    LOGIC-LEAF
                </div>

            </div>


            <button
                class="icon-button sidebar-close"
                id="sidebarClose"
                type="button"
                aria-label="Close sidebar"
            >

                <svg viewBox="0 0 24 24">
                    <path d="M6 6l12 12"></path>
                    <path d="M18 6L6 18"></path>
                </svg>

            </button>

        </div>


        <!-- SIDEBAR ACTIONS -->

        <div class="sidebar-actions">

            <button
                class="new-chat"
                id="newChatBtn"
                type="button"
            >

                <svg viewBox="0 0 24 24">
                    <path d="M12 5v14"></path>
                    <path d="M5 12h14"></path>
                </svg>

                <span>
                    New chat
                </span>

            </button>


            <button
                class="sidebar-nav"
                id="searchBtn"
                type="button"
            >

                <svg viewBox="0 0 24 24">
                    <circle
                        cx="11"
                        cy="11"
                        r="6.5"
                    ></circle>

                    <path d="M16 16l5 5"></path>
                </svg>

                <span>
                    Search chats
                </span>

            </button>

        </div>


        <!-- HISTORY -->

        <div class="history-container">

            <div class="history-title">
                Recent
            </div>

            <div
                class="history"
                id="history"
            >

                <div class="history-empty">
                    Your conversations will appear here.
                </div>

            </div>

        </div>


        <!-- SIDEBAR BOTTOM -->

        <div class="sidebar-bottom">


            <button
                class="sidebar-nav"
                id="helpBtn"
                type="button"
            >

                <svg viewBox="0 0 24 24">

                    <circle
                        cx="12"
                        cy="12"
                        r="9"
                    ></circle>

                    <path
                        d="M9.5 9a2.5 2.5 0 1 1 4.4 1.6c-.8.8-1.9 1.2-1.9 2.7"
                    ></path>

                    <path d="M12 17h.01"></path>

                </svg>

                <span>
                    Help
                </span>

            </button>


            <!-- DEVELOPER -->

            <div class="developer">

                <div class="developer-avatar">
                    VC
                </div>

                <div class="developer-text">

                    <strong>
                        V. CHENCHUKIRAN
                    </strong>

                    <span>
                        Cloud Security &amp; DevSecOps
                    </span>

                </div>

            </div>


            <!-- ACCOUNT -->

            <button
                class="account"
                id="loginBtn"
                type="button"
            >

                <div
                    class="account-avatar"
                    id="userAvatar"
                >
                    G
                </div>

                <div class="account-text">

                    <strong id="userName">
                        Guest
                    </strong>

                    <span id="userStatus">
                        Sign in with Google
                    </span>

                </div>

                <svg
                    class="account-arrow"
                    viewBox="0 0 24 24"
                >
                    <path d="M9 6l6 6-6 6"></path>
                </svg>

            </button>

        </div>

    </aside>


    <!-- =================================================
         MAIN
         ================================================= -->

    <main class="main">


        <!-- =================================================
             TOP BAR
             ================================================= -->

        <header class="topbar">


            <div class="topbar-left">

                <!-- MOBILE MENU -->

                <button
                    class="icon-button mobile-menu"
                    id="menuBtn"
                    type="button"
                    aria-label="Open sidebar"
                >

                    <svg viewBox="0 0 24 24">

                        <path d="M4 7h16"></path>
                        <path d="M4 12h16"></path>
                        <path d="M4 17h16"></path>

                    </svg>

                </button>


                <!-- MODEL -->

                <button
                    class="model-selector"
                    type="button"
                    aria-label="AI model"
                >

                    <span>
                        LOGIC-LEAF
                    </span>

                    <span class="model-version">
                        AI
                    </span>

                    <svg viewBox="0 0 24 24">
                        <path d="M7 10l5 5 5-5"></path>
                    </svg>

                </button>

            </div>


            <!-- TOP RIGHT -->

            <div class="topbar-right">


                <button
                    class="icon-button"
                    id="topSearchBtn"
                    type="button"
                    aria-label="Search"
                >

                    <svg viewBox="0 0 24 24">

                        <circle
                            cx="11"
                            cy="11"
                            r="6.5"
                        ></circle>

                        <path d="M16 16l5 5"></path>

                    </svg>

                </button>


                <button
                    class="icon-button"
                    id="newTopChat"
                    type="button"
                    aria-label="New chat"
                >

                    <svg viewBox="0 0 24 24">

                        <path d="M12 5v14"></path>
                        <path d="M5 12h14"></path>

                    </svg>

                </button>


                <!-- SMALL GOOGLE PROFILE -->

                <button
                    class="profile-button"
                    id="profileButton"
                    type="button"
                    aria-label="Google account"
                >
                    G
                </button>

            </div>

        </header>


        <!-- =================================================
             CHAT AREA
             ================================================= -->

        <section
            class="chat-area"
            id="chatMessages"
        >

            <!-- WELCOME SCREEN IS GENERATED BY APP.JS -->

        </section>


        <!-- =================================================
             COMPOSER
             ================================================= -->

        <div class="composer-area">


            <div class="composer">


                <!-- TEXT INPUT -->

                <textarea
                    id="messageInput"
                    rows="1"
                    maxlength="12000"
                    placeholder="Message LOGIC-LEAF AI..."
                    autocomplete="off"
                    spellcheck="true"
                    aria-label="Message LOGIC-LEAF AI"
                ></textarea>


                <!-- COMPOSER FOOTER -->

                <div class="composer-footer">


                    <!-- LEFT -->

                    <div class="composer-left">


                        <!-- ATTACHMENT -->

                        <button
                            class="composer-button"
                            id="attachmentBtn"
                            type="button"
                            aria-label="Attach file"
                            title="Attach file"
                        >

                            <svg viewBox="0 0 24 24">

                                <path
                                    d="M20.5 11.5L12 20a5 5 0 0 1-7-7l8.5-8.5a3.5 3.5 0 0 1 5 5L10 18a2 2 0 0 1-3-3l7.5-7.5"
                                ></path>

                            </svg>

                        </button>


                        <!-- CAMERA -->

                        <button
                            class="composer-button"
                            id="cameraBtn"
                            type="button"
                            aria-label="Camera"
                            title="Camera"
                        >

                            <svg viewBox="0 0 24 24">

                                <path
                                    d="M4 7h3l1.5-2h7L17 7h3a1 1 0 0 1 1 1v10a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V8a1 1 0 0 1 1-1z"
                                ></path>

                                <circle
                                    cx="12"
                                    cy="13"
                                    r="3.5"
                                ></circle>

                            </svg>

                        </button>


                        <!-- IMAGE -->

                        <button
                            class="composer-button"
                            id="imageBtn"
                            type="button"
                            aria-label="Create image"
                            title="Create image"
                        >

                            <svg viewBox="0 0 24 24">

                                <path
                                    d="M4 5h16v14H4z"
                                ></path>

                                <circle
                                    cx="9"
                                    cy="10"
                                    r="1.5"
                                ></circle>

                                <path
                                    d="M4 17l4-4 3 3 3-4 6 6"
                                ></path>

                            </svg>

                        </button>


                        <!-- FILE INPUT -->

                        <input
                            type="file"
                            id="fileInput"
                            hidden
                            multiple
                        >

                    </div>


                    <!-- RIGHT -->

                    <div class="composer-right">

                        <span class="enter-label">
                            Enter to send
                        </span>


                        <button
                            class="send-button"
                            id="sendBtn"
                            type="button"
                            aria-label="Send message"
                            title="Send message"
                        >

                            <svg viewBox="0 0 24 24">

                                <path
                                    d="M12 19V5"
                                ></path>

                                <path
                                    d="M6 11l6-6 6 6"
                                ></path>

                            </svg>

                        </button>

                    </div>

                </div>

            </div>


            <p class="disclaimer">
                LOGIC-LEAF AI can make mistakes.
                Check important information.
            </p>

        </div>

    </main>

</div>


<!-- =====================================================
     JAVASCRIPT
     ===================================================== -->

<script
    src="app.js"
    defer
></script>

</body>
             </html>
