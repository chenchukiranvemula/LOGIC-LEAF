<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="theme-color"
    content="#171717"
  >

  <title>QTM AI</title>

  <link rel="stylesheet" href="style.css">
</head>


<body>

  <div class="app">


    <!-- SIDEBAR -->

    <aside
      class="sidebar"
      id="sidebar"
    >

      <div>

        <div class="brand">
          <div class="brand-name">
            QTM AI
          </div>
        </div>


        <button
          id="newChatBtn"
          class="new-chat"
          type="button"
        >
          <span>+</span>
          New chat
        </button>


        <button
          id="searchBtn"
          class="sidebar-action"
          type="button"
        >
          <span>⌕</span>
          Search chats
        </button>


        <div class="section-title">
          Chats
        </div>


        <div
          id="chatHistory"
          class="chat-history"
        ></div>

      </div>


      <div class="sidebar-bottom">

        <button
          id="settingsBtn"
          class="sidebar-action"
          type="button"
        >
          <span>Settings</span>
        </button>


        <button
          id="googleLoginBtn"
          class="account"
          type="button"
        >

          <div class="account-avatar">
            G
          </div>

          <div class="account-info">

            <strong>
              Sign in
            </strong>

            <small>
              Google account
            </small>

          </div>

        </button>

      </div>

    </aside>


    <!-- MAIN -->

    <main class="main">


      <!-- HEADER -->

      <header class="header">

        <button
          id="menuBtn"
          class="menu-button"
          type="button"
          aria-label="Open menu"
        >
          ☰
        </button>


        <button
          id="modelButton"
          class="model-button"
          type="button"
        >
          QTM AI
          <span>⌄</span>
        </button>

      </header>


      <!-- CHAT -->

      <section
        id="chatMessages"
        class="chat-area"
      >


        <!-- WELCOME -->

        <div
          id="welcome"
          class="welcome"
        >

          <h1>
            How can I help you?
          </h1>

          <p>
            Ask QTM AI anything.
          </p>


          <div class="suggestions">


            <button
              type="button"
              onclick="useSuggestion('Explain this topic simply')"
            >
              Explain something
            </button>


            <button
              type="button"
              onclick="useSuggestion('Help me solve this problem step by step')"
            >
              Solve a problem
            </button>


            <button
              type="button"
              onclick="useSuggestion('Write code for me')"
            >
              Write code
            </button>


            <button
              type="button"
              onclick="useSuggestion('Help me create a study plan')"
            >
              Study with me
            </button>

          </div>

        </div>

      </section>


      <!-- MESSAGE BOX -->

      <div class="composer-area">

        <div class="composer">


          <button
            id="attachBtn"
            class="attach-button"
            type="button"
            aria-label="Attach"
          >
            +
          </button>


          <textarea
            id="chatInput"
            placeholder="Message QTM AI"
            rows="1"
            autocomplete="off"
            spellcheck="true"
          ></textarea>


          <button
            id="sendBtn"
            class="send-button"
            type="button"
          >
            Send
          </button>


        </div>


        <div class="composer-note">
          QTM AI can make mistakes. Check important information.
        </div>

      </div>


    </main>

  </div>


  <!-- JAVASCRIPT FILE -->

  <script src="app.js"></script>

</body>

  </html>
