<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0">
    <meta name="theme-color" content="#030605">

    <title>QTM AI</title>

    <link rel="stylesheet" href="style.css">

    <!-- Google Identity Services -->
    <script
        src="https://accounts.google.com/gsi/client"
        async
        defer>
    </script>
</head>

<body>

    <!-- BACKGROUND -->
    <div class="background-glow"></div>
    <div class="leaf"></div>

    <!-- =================================================
         LOGIN SCREEN
    ================================================== -->

    <section id="loginScreen" class="login-screen">

        <div class="login-card">

            <div class="login-logo">
                Q
            </div>

            <div class="login-title">
                QTM AI
            </div>

            <div class="login-subtitle">
                Your intelligent AI workspace
            </div>

            <div class="login-line"></div>

            <div class="google-area">

                <div id="googleButton"></div>

            </div>

            <p class="login-note">
                Sign in securely with your Google Account.
            </p>

        </div>

    </section>


    <!-- =================================================
         APPLICATION
    ================================================== -->

    <div id="app" class="app hidden">

        <!-- SIDEBAR -->

        <aside class="sidebar">

            <div class="brand">

                <div class="brand-logo">
                    Q
                </div>

                <div>
                    <div class="brand-name">
                        QTM AI
                    </div>

                    <div class="brand-version">
                        V1
                    </div>
                </div>

            </div>


            <button
                id="newChat"
                class="new-chat"
                type="button">

                <span class="plus">
                    ＋
                </span>

                <span>
                    New chat
                </span>

            </button>


            <div class="section-label">
                CHATS
            </div>


            <div
                id="chatList"
                class="chat-list">
            </div>


            <!-- USER -->

            <div class="user-area">

                <img
                    id="userAvatar"
                    class="user-avatar"
                    alt="Profile">

                <div class="user-details">

                    <div
                        id="userName"
                        class="user-name">
                        User
                    </div>

                    <div
                        id="userEmail"
                        class="user-email">
                        Signed in
                    </div>

                </div>


                <button
                    id="logoutButton"
                    class="logout-button"
                    title="Sign out">

                    ⎋

                </button>

            </div>

        </aside>


        <!-- MAIN -->

        <main class="main">


            <!-- TOPBAR -->

            <header class="topbar">

                <div class="mobile-brand">

                    <div class="mobile-logo">
                        Q
                    </div>

                    <span>
                        QTM AI
                    </span>

                </div>


                <div class="top-status">

                    <span class="status-dot"></span>

                    <span>
                        Online
                    </span>

                </div>

            </header>


            <!-- MESSAGES -->

            <section
                id="messages"
                class="messages">
            </section>


            <!-- COMPOSER -->

            <div class="composer-area">

                <div class="composer">

                    <textarea
                        id="messageInput"
                        rows="1"
                        maxlength="12000"
                        placeholder="Ask QTM AI anything..."
                        autocomplete="off"
                        spellcheck="true">
                    </textarea>


                    <button
                        id="sendBtn"
                        class="send-btn"
                        type="button"
                        aria-label="Send">

                        ↑

                    </button>

                </div>


                <div class="disclaimer">
                    QTM AI may make mistakes. Check important information.
                </div>

            </div>

        </main>

    </div>


    <script src="app.js"></script>

</body>
                  </html>
