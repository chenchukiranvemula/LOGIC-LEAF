<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="theme-color"
    content="#020504"
  >

  <meta
    name="description"
    content="QTM AI — Your intelligent AI assistant"
  >

  <title>QTM AI</title>

  <link
    rel="stylesheet"
    href="style.css"
  >
</head>


<body>

  <!-- =========================================
       SINGLE CINEMATIC LEAF
       ========================================= -->

  <div
    class="qtm-leaf"
    aria-hidden="true"
  >
    <div class="leaf-vein"></div>
    <div class="leaf-glow"></div>
  </div>


  <!-- =========================================
       SIDEBAR
       ========================================= -->

  <aside
    class="sidebar"
    id="sidebar"
  >

    <div class="brand">
      QTM <span>AI</span>
    </div>


    <button
      class="new-chat"
      id="newChat"
      type="button"
    >
      ＋ New chat
    </button>


    <div class="side-title">
      Chats
    </div>


    <div
      id="chatList"
      class="chat-list"
    ></div>


    <div class="sidebar-bottom">

      <button
        id="settingsBtn"
        type="button"
      >
        ⚙ Settings
      </button>

    </div>

  </aside>


  <!-- =========================================
       MAIN APPLICATION
       ========================================= -->

  <main class="app">


    <!-- TOP BAR -->

    <header class="topbar">

      <button
        class="icon-btn"
        id="menuBtn"
        type="button"
        aria-label="Open menu"
      >
        ☰
      </button>


      <div class="model-name">

        QTM AI

        <small>
          V2
        </small>

      </div>


      <button
        class="icon-btn"
        id="clearBtn"
        type="button"
        aria-label="Clear chat"
      >
        ⌫
      </button>

    </header>


    <!-- =======================================
         MESSAGE AREA
         ======================================= -->

    <section
      id="messages"
      class="messages"
    >


      <!-- WELCOME -->

      <div class="welcome">

        <div
          class="logo-orb"
          aria-hidden="true"
        >
          Q
        </div>


        <h1>
          How can I help you?
        </h1>


        <p>
          Welcome to QTM AI.
          Ask questions, study,
          create and explore.
        </p>


        <!-- QUICK ACTIONS -->

        <div class="quick">


          <button
            type="button"
            data-prompt="Explain this topic simply"
          >
            📚 Explain a topic
          </button>


          <button
            type="button"
            data-prompt="Help me study for an exam"
          >
            🎓 Study help
          </button>


          <button
            type="button"
            data-prompt="Give me ideas for a project"
          >
            💡 Project ideas
          </button>


          <button
            type="button"
            data-prompt="Create a PDF about renewable energy"
          >
            📄 Create a PDF
          </button>


        </div>

      </div>

    </section>


    <!-- =======================================
         COMPOSER
         ======================================= -->

    <div class="composer-wrap">


      <!-- TOOLS -->

      <div class="tools">


        <button
          id="attachBtn"
          type="button"
        >
          📎 Attach
        </button>


        <button
          id="imageBtn"
          type="button"
        >
          🖼 Image
        </button>


        <button
          id="pdfBtn"
          type="button"
        >
          📄 PDF
        </button>


        <input
          id="fileInput"
          type="file"
          hidden
          accept=".txt,.md,.pdf,.json,.csv"
        >

      </div>


      <!-- MESSAGE INPUT -->

      <form
        id="composer"
        class="composer"
      >


        <textarea
          id="prompt"
          rows="1"
          placeholder="Message QTM AI..."
          autocomplete="off"
          aria-label="Message QTM AI"
        ></textarea>


        <button
          id="sendBtn"
          type="submit"
          aria-label="Send message"
        >
          ➤
        </button>


      </form>


      <div class="notice">
        QTM AI can make mistakes.
        Check important information.
      </div>


    </div>

  </main>


  <!-- =========================================
       JAVASCRIPT
       ========================================= -->

  <script src="app.js"></script>

</body>

          </html>
