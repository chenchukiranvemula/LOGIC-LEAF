<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta name="theme-color" content="#050807">

    <title>QTM AI</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
        rel="stylesheet"
    >

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- ================= BACKGROUND ================= -->

    <div class="background">

        <div class="leaf-glow"></div>

        <div class="leaf"></div>

        <div class="particle particle-1"></div>
        <div class="particle particle-2"></div>
        <div class="particle particle-3"></div>
        <div class="particle particle-4"></div>

    </div>


    <!-- ================= APP ================= -->

    <div class="app">


        <!-- ================= SIDEBAR ================= -->

        <aside
            class="sidebar"
            id="sidebar"
        >

            <div class="sidebar-top">


                <!-- BRAND -->

                <div class="brand">

                    <div class="brand-logo">
                        Q
                    </div>

                    <div class="brand-text">

                        <strong>
                            QTM AI
                        </strong>

                        <span>
                            Intelligence redefined
                        </span>

                    </div>

                </div>


                <!-- NEW CHAT -->

                <button
                    class="new-chat"
                    id="newChatBtn"
                    type="button"
                >

                    <span class="new-chat-icon">
                        ＋
                    </span>

                    <span>
                        New chat
                    </span>

                </button>


                <!-- CHAT LABEL -->

                <div class="sidebar-label">
                    CHATS
                </div>


                <!-- HISTORY -->

                <div
                    class="history"
                    id="history"
                >

                    <div class="empty-history">

                        Your conversations
                        <br>

                        will appear here.

                    </div>

                </div>

            </div>


            <!-- SIDEBAR BOTTOM -->

            <div class="sidebar-bottom">


                <button
                    class="side-item"
                    type="button"
                >

                    <span>⚙</span>

                    <span>
                        Settings
                    </span>

                </button>


                <button
                    class="side-item"
                    type="button"
                >

                    <span>?</span>

                    <span>
                        Help
                    </span>

                </button>


                <!-- GOOGLE ACCOUNT -->

                <div class="account">

                    <div class="account-avatar">
                        G
                    </div>

                    <div class="account-info">

                        <strong>
                            Guest
                        </strong>

                        <span>
                            Sign in with Google
                        </span>

                    </div>

                    <span class="account-arrow">
                        ›
                    </span>

                </div>

            </div>

        </aside>


        <!-- ================= MAIN ================= -->

        <main class="main">


            <!-- ================= TOP BAR ================= -->

            <header class="topbar">


                <!-- MOBILE MENU -->

                <button
                    class="menu-btn"
                    id="menuBtn"
                    type="button"
                    aria-label="Open menu"
                >

                    <span></span>
                    <span></span>
                    <span></span>

                </button>


                <!-- MOBILE BRAND -->

                <div class="mobile-brand">

                    <div class="mobile-logo">
                        Q
                    </div>

                    <strong>
                        QTM AI
                    </strong>

                </div>


                <!-- TOP RIGHT -->

                <div class="topbar-right">

                    <button
                        class="top-icon"
                        type="button"
                        title="Search"
                    >
                        ⌕
                    </button>


                    <button
                        class="top-icon"
                        type="button"
                        title="Notifications"
                    >
                        ♢
                    </button>


                    <button
                        class="profile-button"
                        type="button"
                        title="Google Login"
                    >
                        G
                    </button>

                </div>

            </header>


            <!-- ================= CHAT ================= -->

            <section
                class="chat-messages"
                id="chatMessages"
            >

            </section>


            <!-- ================= COMPOSER ================= -->

            <div class="composer-area">


                <div class="composer">


                    <!-- TEXT -->

                    <textarea
                        id="messageInput"
                        placeholder="Message QTM AI..."
                        rows="1"
                        autocomplete="off"
                        spellcheck="true"
                    ></textarea>


                    <!-- CONTROLS -->

                    <div class="composer-bottom">


                        <!-- LEFT TOOLS -->

                        <div class="composer-tools">


                            <!-- FILE -->

                            <button
                                class="tool-btn"
                                id="attachmentBtn"
                                type="button"
                                title="Attach file"
                                aria-label="Attach file"
                            >
                                📎
                            </button>


                            <!-- CAMERA -->

                            <button
                                class="tool-btn"
                                id="cameraBtn"
                                type="button"
                                title="Camera"
                                aria-label="Camera"
                            >
                                📷
                            </button>


                            <!-- IMAGE -->

                            <button
                                class="tool-btn image-tool"
                                id="imageBtn"
                                type="button"
                                title="Create image"
                                aria-label="Create image"
                            >
                                ✦
                            </button>


                            <!-- HIDDEN FILE INPUT -->

                            <input
                                type="file"
                                id="fileInput"
                                hidden
                            >

                        </div>


                        <!-- RIGHT TOOLS -->

                        <div class="composer-actions">

                            <span class="shortcut">
                                Enter ↵
                            </span>


                            <button
                                class="send-btn"
                                id="sendBtn"
                                type="button"
                                title="Send message"
                                aria-label="Send message"
                            >
                                ↑
                            </button>

                        </div>

                    </div>

                </div>


                <p class="disclaimer">
                    QTM AI can make mistakes.
                    Check important information.
                </p>

            </div>

        </main>

    </div>


    <!-- ================= MOBILE OVERLAY ================= -->

    <div
        class="overlay"
        id="overlay"
    ></div>


    <!-- ================= APP JS ================= -->

    <!-- IMPORTANT:
         type="module" is required
         because app.js imports Firebase.
    -->

    <script
        type="module"
        src="app.js"
    ></script>

</body>
    </html>
